# Linux x86-64 builds of BOZ64 (pc/unix.cmake). The game files are never here: every package asks for them on first
# start. A push only builds and checks the program; the packages are made when the workflow is run by hand
# (Actions > linux > Run workflow, or `gh workflow run linux`) or for a tag, to save build minutes.
name: linux

on:
  push:
  workflow_dispatch:

env:
  PACKAGES: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}

jobs:
  # the program, its start-up check, and the packages Ubuntu can make: .tar.gz, .deb, AppImage
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libboost-dev zlib1g-dev libegl-dev libgles-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libpulse-dev libasound2-dev \
            libpipewire-0.3-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev

      - name: Configure
        run: cmake -S pc -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build

      # With no game files it must start, log, and stop with the message that says where to put them.
      - name: Start-up check
        run: |
          export BOZ64_HOME="$RUNNER_TEMP/boz64" SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          set +e
          ./build/boz64
          code=$?
          set -e
          cat "$BOZ64_HOME/boz64.log"
          test "$code" -eq 1
          grep -q "needs the game files" "$BOZ64_HOME/boz64.log"

      - name: Portable .tar.gz
        if: env.PACKAGES == 'true'
        run: |
          d=BOZ64-linux-x86_64
          mkdir -p dist/$d
          cp build/boz64 pc/dist/linux/README.txt pc/dist/linux/boz64.png dist/$d/
          tar -C dist -czf dist/$d.tar.gz $d

      - name: .deb
        if: env.PACKAGES == 'true'
        run: cd build && cpack -G DEB && mv ./*.deb ../dist/

      - name: AppImage
        if: env.PACKAGES == 'true'
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          OUTPUT=dist/BOZ64-x86_64.AppImage ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/io.github.nebuiacore.BOZ64.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/192x192/apps/io.github.nebuiacore.BOZ64.png --output appimage

      - uses: actions/upload-artifact@v4
        with:
          name: boz64-linux-x86_64
          path: |
            build/boz64
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage

  rpm:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tools and libraries
        run: dnf install -y clang cmake ninja-build boost-devel zlib-devel libglvnd-devel mesa-libEGL-devel mesa-libGLES-devel SDL3-devel rpm-build
      - name: Build and package
        run: |
          cmake -S pc -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBOZ_FETCH_SDL=OFF
          cmake --build build
          cd build && cpack -G RPM
      - uses: actions/upload-artifact@v4
        with:
          name: boz64-rpm
          path: build/*.rpm
      # the same checks on the unstripped program, so a crash's backtrace has names (Fedora's newer Clang and SDL)
      - name: Check the built program
        run: sh pc/dist/test-package.sh bin build

  arch:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Build tools and libraries
        run: pacman -Syu --noconfirm --needed base-devel cmake ninja sdl3 boost clang zlib libglvnd git
      - uses: actions/checkout@v4
      - name: makepkg
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/pc/dist/arch' && makepkg --noconfirm"
      - uses: actions/upload-artifact@v4
        with:
          name: boz64-arch
          path: pc/dist/arch/*.pkg.tar.zst

  flatpak:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # on the runner itself: the flatpak-github-actions container failed to update its runtimes (cross-device link)
    steps:
      - uses: actions/checkout@v4
      - name: Build the Flatpak
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak flatpak-builder xvfb
          # Ubuntu 24.04 keeps unprivileged user namespaces from bubblewrap by default
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse --repo=repo \
            flatpak-build pc/dist/flatpak/io.github.nebuiacore.BOZ64.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo BOZ64.flatpak \
            io.github.nebuiacore.BOZ64
      - uses: actions/upload-artifact@v4
        with:
          name: boz64-flatpak
          path: BOZ64.flatpak
      # installed from the bundle as a user would, then the same two checks as pc/dist/test-package.sh
      - name: Test the Flatpak
        run: |
          app=io.github.nebuiacore.BOZ64
          log="$HOME/.var/app/$app/data/BOZ64/boz64.log"
          flatpak --user install -y --noninteractive BOZ64.flatpak
          set +e
          flatpak run --env=SDL_VIDEODRIVER=dummy --env=SDL_AUDIODRIVER=dummy $app
          code=$?
          set -e
          cat "$log"; test "$code" -eq 1; grep -q "needs the game files" "$log"
          set +e
          xvfb-run -a flatpak run --env=SDL_AUDIODRIVER=dummy --env=LIBGL_ALWAYS_SOFTWARE=1 --env=debug_boz64_selftest=1 $app
          code=$?
          set -e
          cat "$log"; test "$code" -eq 0; grep -q "self-test: all work" "$log"

  snap:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: snap
      - uses: actions/upload-artifact@v4
        with:
          name: boz64-snap
          path: ${{ steps.snap.outputs.snap }}
      # installed as a user would (--dangerous: not from the store), then the same two checks as test-package.sh
      - name: Test the Snap
        run: |
          sudo snap install gnome-46-2404 mesa-2404 gtk-common-themes
          sudo snap install --dangerous "${{ steps.snap.outputs.snap }}"
          sudo apt-get install -y -q xvfb
          log="$HOME/snap/boz64/current/.local/share/BOZ64/boz64.log"
          set +e
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy /snap/bin/boz64
          code=$?
          set -e
          cat "$log"; test "$code" -eq 1; grep -q "needs the game files" "$log"
          set +e
          SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 debug_boz64_selftest=1 xvfb-run -a /snap/bin/boz64
          code=$?
          set -e
          cat "$log"; test "$code" -eq 0; grep -q "self-test: all work" "$log"

  # each package installed in a fresh copy of the systems it is for, then checked (pc/dist/test-package.sh)
  test:
    needs: [build, rpm, arch]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    name: test ${{ matrix.kind }} on ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: deb, image: 'ubuntu:24.04'}
          - {kind: deb, image: 'debian:13'}
          - {kind: tgz, image: 'ubuntu:24.04'}
          - {kind: appimage, image: 'ubuntu:24.04'}
          - {kind: appimage, image: 'fedora:latest'}
          - {kind: rpm, image: 'fedora:latest'}
          - {kind: arch, image: 'archlinux:latest'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: sh pc/dist/test-package.sh ${{ matrix.kind }} artifacts
