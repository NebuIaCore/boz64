# Linux x86-64 builds of BOZ64 (pc/unix.cmake). The game files are never here: every package asks for them on first
# start. A push only builds and checks the program; the packages are made when the workflow is run by hand
# (Actions > linux > Run workflow, or `gh workflow run linux`) or for a tag, to save build minutes.
name: linux

on:
  push:
  workflow_dispatch:

env:
  PACKAGES: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}

jobs:
  # the program, its start-up check, and the packages Ubuntu can make: .tar.gz, .deb, AppImage
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libboost-dev zlib1g-dev libegl-dev libgles-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libpulse-dev libasound2-dev \
            libpipewire-0.3-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev

      - name: Configure
        run: cmake -S pc -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build

      # With no game files it must start, log, and stop with the message that says where to put them.
      - name: Start-up check
        run: |
          export BOZ64_HOME="$RUNNER_TEMP/boz64" SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          set +e
          ./build/boz64
          code=$?
          set -e
          cat "$BOZ64_HOME/boz64.log"
          test "$code" -eq 1
          grep -q "needs the game files" "$BOZ64_HOME/boz64.log"

      - name: Portable .tar.gz
        if: env.PACKAGES == 'true'
        run: |
          d=BOZ64-linux-x86_64
          mkdir -p dist/$d
          cp build/boz64 pc/dist/linux/README.txt pc/dist/linux/boz64.png dist/$d/
          tar -C dist -czf dist/$d.tar.gz $d

      - name: .deb
        if: env.PACKAGES == 'true'
        run: cd build && cpack -G DEB && mv ./*.deb ../dist/

      - name: AppImage
        if: env.PACKAGES == 'true'
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          OUTPUT=dist/BOZ64-x86_64.AppImage ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/io.github.nebuiacore.BOZ64.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/192x192/apps/io.github.nebuiacore.BOZ64.png --output appimage

      - uses: actions/upload-artifact@v4
        with:
          name: boz64-linux-x86_64
          path: |
            build/boz64
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage

  rpm:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tools and libraries
        run: dnf install -y clang cmake ninja-build boost-devel zlib-devel libglvnd-devel mesa-libEGL-devel mesa-libGLES-devel SDL3-devel rpm-build
      - name: Build and package
        run: |
          cmake -S pc -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBOZ_FETCH_SDL=OFF
          cmake --build build
          cd build && cpack -G RPM
      - uses: actions/upload-artifact@v4
        with:
          name: boz64-rpm
          path: build/*.rpm

  arch:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Build tools and libraries
        run: pacman -Syu --noconfirm --needed base-devel cmake ninja sdl3 boost clang zlib libglvnd git
      - uses: actions/checkout@v4
      - name: makepkg
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/pc/dist/arch' && makepkg --noconfirm"
      - uses: actions/upload-artifact@v4
        with:
          name: boz64-arch
          path: pc/dist/arch/*.pkg.tar.zst

  flatpak:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: BOZ64.flatpak
          manifest-path: pc/dist/flatpak/io.github.nebuiacore.BOZ64.yml
          cache-key: flatpak-builder-${{ github.sha }}

  snap:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: snap
      - uses: actions/upload-artifact@v4
        with:
          name: boz64-snap
          path: ${{ steps.snap.outputs.snap }}
